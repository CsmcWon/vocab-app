<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaBoost - 英単語学習アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Zen Maru Gothic', sans-serif;
            touch-action: manipulation;
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md bg-slate-800 sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[90vh] sm:border sm:border-slate-700 relative">
        
        <!-- Header -->
        <header class="bg-slate-900/90 backdrop-blur-md px-5 py-3.5 flex items-center justify-between border-b border-slate-700/60 sticky top-0 z-20 shrink-0">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="app.goHome()">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i data-lucide="zap" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">VocaBoost</span>
            </div>
            <div id="header-user-info" class="hidden items-center space-x-2">
                <span id="header-username" class="text-xs font-semibold px-3 py-1 bg-slate-700 text-slate-300 rounded-full truncate max-w-[120px]"></span>
                <button onclick="app.logout()" class="text-slate-400 hover:text-red-400 p-1.5 transition rounded-lg hover:bg-slate-700/50" title="ログアウト">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto p-5 flex flex-col justify-between relative">
            <!-- Dynamic views injected via JS -->
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center pop-in shadow-2xl">
            <div id="modal-icon-wrapper" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4 bg-indigo-500/20 text-indigo-400">
                <i id="modal-icon" data-lucide="info" class="w-6 h-6"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-100 mb-2">通知</h3>
            <p id="modal-message" class="text-slate-300 text-sm mb-6 leading-relaxed"></p>
            <button id="modal-btn" onclick="app.closeModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition">OK</button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // 内蔵英単語データ（難易度 A / B / C 付与）
        const DEFAULT_WORDS = [
            // ランクA（初級・基本）
            { id: 1, en: "abandon", ja: "見捨てる、断念する", level: "A" },
            { id: 2, en: "ability", ja: "能力、才能", level: "A" },
            { id: 3, en: "abroad", ja: "外国へ、海外で", level: "A" },
            { id: 4, en: "absolute", ja: "絶対的な、完全な", level: "A" },
            { id: 5, en: "academic", ja: "学問の、大学の", level: "A font" },
            { id: 6, en: "accept", ja: "受け入れる、承認する", level: "A" },
            { id: 7, en: "access", ja: "接近方法、利用する権利", level: "A" },
            // ランクB（中級）
            { id: 8, en: "accident", ja: "事故、偶然の出来事", level: "B" },
            { id: 9, en: "accompany", ja: "同行する、付随する", level: "B" },
            { id: 10, en: "accomplish", ja: "成し遂げる、達成する", level: "B" },
            { id: 11, en: "account", ja: "口座、説明する", level: "B" },
            { id: 12, en: "accurate", ja: "正確な、精密な", level: "B" },
            { id: 13, en: "achieve", ja: "達成する、成し遂げる", level: "B" },
            { id: 14, en: "acknowledge", ja: "認める、謝意を表す", level: "B" },
            // ランクC（上級）
            { id: 15, en: "acquire", ja: "獲得する、習得する", level: "C" },
            { id: 16, en: "adapt", ja: "適応させる、適合する", level: "C" },
            { id: 17, en: "addition", ja: "追加、足し算", level: "C" },
            { id: 18, en: "adequate", ja: "十分な、適切な", level: "C" },
            { id: 19, en: "adjust", ja: "調節する、慣れる", level: "C" },
            { id: 20, en: "administration", ja: "管理、経営、政権", level: "C" }
        ];

        class VocabApp {
            constructor() {
                this.currentUser = localStorage.getItem('vocab_current_user') || null;
                this.words = this.loadWords();
                this.selectedLevel = 'ALL'; // 'ALL', 'A', 'B', 'C'
                this.selectedOrder = 'sequential'; // 'sequential' (順番) または 'random' (ランダム)
                this.currentView = this.currentUser ? 'home' : 'login';
                this.quizState = {
                    questions: [],
                    currentIndex: 0,
                    score: 0,
                    correctCount: 0,
                    timer: null,
                    timeLeft: 10,
                    isAnswered: false
                };
                this.initSpeech();
            }

            initSpeech() {
                this.synth = window.speechSynthesis;
            }

            speak(text) {
                if (!this.synth) return;
                this.synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                this.synth.speak(utterance);
            }

            loadWords() {
                const saved = localStorage.getItem('vocab_custom_words');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        return DEFAULT_WORDS;
                    }
                }
                return DEFAULT_WORDS;
            }

            saveCustomWords(words) {
                this.words = words;
                localStorage.setItem('vocab_custom_words', JSON.stringify(words));
            }

            getUsersData() {
                const saved = localStorage.getItem('vocab_users_data');
                return saved ? JSON.parse(saved) : {};
            }

            saveUserData(username, stats) {
                const data = this.getUsersData();
                if (!data[username]) {
                    data[username] = { history: [], totalAnswered: 0, totalCorrect: 0 };
                }
                data[username].history.unshift(stats); // 最新順
                data[username].totalAnswered += stats.total;
                data[username].totalCorrect += stats.correct;
                localStorage.setItem('vocab_users_data', JSON.stringify(data));
            }

            getCurrentUserData() {
                if (!this.currentUser) return { history: [], totalAnswered: 0, totalCorrect: 0 };
                const data = this.getUsersData();
                return data[this.currentUser] || { history: [], totalAnswered: 0, totalCorrect: 0 };
            }

            login(name) {
                const trimmed = name.trim();
                if (!trimmed) {
                    this.showModal('エラー', 'お名前を入力してください。', 'alert-circle');
                    return;
                }
                this.currentUser = trimmed;
                localStorage.setItem('vocab_current_user', trimmed);
                this.currentView = 'home';
                this.render();
            }

            logout() {
                this.currentUser = null;
                localStorage.removeItem('vocab_current_user');
                this.currentView = 'login';
                this.render();
            }

            goHome() {
                if (this.currentUser) {
                    this.stopQuizTimer();
                    this.currentView = 'home';
                    this.render();
                }
            }

            startQuiz(count = 10) {
                // 選択された難易度で単語をフィルタリング
                let filtered = this.words;
                if (this.selectedLevel !== 'ALL') {
                    filtered = this.words.filter(w => (w.level || 'A') === this.selectedLevel);
                }

                if (filtered.length < 4) {
                    this.showModal('注意', `選択した難易度(${this.selectedLevel})の単語が4語未満のためクイズを開始できません。他の難易度を選ぶか単語を追加してください。`, 'alert-triangle');
                    return;
                }

                // 順序（順番通りかランダムか）の適用
                let targetWords = [...filtered];
                if (this.selectedOrder === 'random') {
                    targetWords.sort(() => Math.random() - 0.5);
                }

                const selected = targetWords.slice(0, Math.min(count, targetWords.length));

                this.quizState.questions = selected.map(item => {
                    // 誤答の選択肢を全体（または同レベル）から3つ抽出
                    const distractors = this.words
                        .filter(w => w.id !== item.id)
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 3)
                        .map(w => w.ja);
                    
                    const choices = [...distractors, item.ja].sort(() => Math.random() - 0.5);

                    return {
                        en: item.en,
                        ja: item.ja,
                        choices: choices
                    };
                });

                this.quizState.currentIndex = 0;
                this.quizState.correctCount = 0;
                this.quizState.isAnswered = false;
                this.currentView = 'quiz';
                this.render();
                this.playCurrentAudio();
            }

            startQuizTimer() {
                this.stopQuizTimer();
                this.quizState.timeLeft = 10;
                this.updateTimerDisplay();

                this.quizState.timer = setInterval(() => {
                    this.quizState.timeLeft--;
                    this.updateTimerDisplay();

                    if (this.quizState.timeLeft <= 0) {
                        this.stopQuizTimer();
                        this.handleTimeout();
                    }
                }, 1000);
            }

            stopQuizTimer() {
                if (this.quizState.timer) {
                    clearInterval(this.quizState.timer);
                    this.quizState.timer = null;
                }
            }

            updateTimerDisplay() {
                const timerText = document.getElementById('timer-text');
                const timerBar = document.getElementById('timer-bar');
                if (timerText) timerText.textContent = `${this.quizState.timeLeft}秒`;
                if (timerBar) timerBar.style.width = `${(this.quizState.timeLeft / 10) * 100}%`;
            }

            playCurrentAudio() {
                const currentQ = this.quizState.questions[this.quizState.currentIndex];
                if (currentQ) {
                    this.speak(currentQ.en);
                }
            }

            handleTimeout() {
                const qs = this.quizState;
                if (qs.isAnswered) return;
                qs.isAnswered = true;

                const currentQ = qs.questions[qs.currentIndex];
                
                currentQ.choices.forEach((choice, idx) => {
                    const btn = document.getElementById(`choice-${idx}`);
                    if (btn) {
                        if (choice === currentQ.ja) {
                            btn.classList.remove('bg-slate-900', 'border-slate-700');
                            btn.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-300');
                        } else {
                            btn.classList.add('opacity-50');
                        }
                        btn.disabled = true;
                    }
                });

                const warning = document.getElementById('time-warning');
                if (warning) {
                    warning.textContent = "時間切れ！正解を確認して「次の問題へ」を押してください。";
                    warning.classList.remove('text-slate-500');
                    warning.classList.add('text-amber-400', 'font-bold');
                }

                this.playCurrentAudio();
                this.showNextButton();
            }

            handleAnswer(selectedIndex) {
                const qs = this.quizState;
                if (qs.isAnswered) return;
                qs.isAnswered = true;
                this.stopQuizTimer();

                const currentQ = qs.questions[qs.currentIndex];
                const selectedChoice = currentQ.choices[selectedIndex];
                const isCorrect = (selectedChoice === currentQ.ja);

                if (isCorrect) {
                    qs.correctCount++;
                }

                currentQ.choices.forEach((choice, idx) => {
                    const btn = document.getElementById(`choice-${idx}`);
                    if (btn) {
                        if (choice === currentQ.ja) {
                            btn.classList.remove('bg-slate-900', 'border-slate-700');
                            btn.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-300');
                        } else if (idx === selectedIndex && !isCorrect) {
                            btn.classList.remove('bg-slate-900', 'border-slate-700');
                            btn.classList.add('bg-red-600/30', 'border-red-500', 'text-red-300', 'shake');
                        } else {
                            btn.classList.add('opacity-50');
                        }
                        btn.disabled = true;
                    }
                });

                this.playCurrentAudio();
                this.showNextButton();
            }

            showNextButton() {
                const nextBtnContainer = document.getElementById('next-btn-container');
                if (nextBtnContainer) {
                    nextBtnContainer.classList.remove('hidden');
                    nextBtnContainer.classList.add('pop-in');
                }
            }

            nextQuestion() {
                const qs = this.quizState;
                qs.currentIndex++;
                qs.isAnswered = false;

                if (qs.currentIndex < qs.questions.length) {
                    this.currentView = 'quiz';
                    this.render();
                    this.startQuizTimer();
                    this.playCurrentAudio();
                } else {
                    this.saveCurrentQuizResult();
                    this.currentView = 'result';
                    this.render();
                }
            }

            saveCurrentQuizResult() {
                const qs = this.quizState;
                const total = qs.questions.length;
                const correct = qs.correctCount;
                const accuracy = Math.round((correct / total) * 100);
                
                const stats = {
                    date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    total: total,
                    correct: correct,
                    accuracy: accuracy
                };

                this.saveUserData(this.currentUser, stats);
            }

            importCSV() {
                const text = document.getElementById('csv-input').value.trim();
                if (!text) {
                    this.showModal('エラー', 'CSVデータが入力されていません。', 'alert-triangle');
                    return;
                }

                const lines = text.split('\n');
                const newWords = [...this.words];
                let maxId = newWords.reduce((max, w) => Math.max(max, w.id), 0);
                let addedCount = 0;

                for (let line of lines) {
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const en = parts[0].trim();
                        const ja = parts[1].trim();
                        // 3列目に難易度(A, B, C)が指定されていれば取得、なければ'A'
                        const level = parts[2] ? parts[2].trim().toUpperCase() : 'A';
                        if (en && ja) {
                            maxId++;
                            newWords.push({ id: maxId, en, ja, level: ['A', 'B', 'C'].includes(level) ? level : 'A' });
                            addedCount++;
                        }
                    }
                }

                if (addedCount > 0) {
                    this.saveCustomWords(newWords);
                    this.showModal('成功', `${addedCount} 語の単語を追加しました！`, 'check-circle');
                    document.getElementById('csv-input').value = '';
                    this.render();
                } else {
                    this.showModal('エラー', '有効なフォーマット（英語,日本語,難易度）で見つかりませんでした。', 'alert-triangle');
                }
            }

            resetDefaultWords() {
                this.saveCustomWords(DEFAULT_WORDS);
                this.showModal('初期化完了', '単語リストを初期の基本データにリセットしました。', 'check-circle');
                this.render();
            }

            showModal(title, message, iconName = 'info') {
                const modal = document.getElementById('modal-container');
                const modalTitle = document.getElementById('modal-title');
                const modalMessage = document.getElementById('modal-message');
                const modalIcon = document.getElementById('modal-icon');

                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalIcon.setAttribute('data-lucide', iconName);
                modal.classList.remove('hidden');
                lucide.createIcons();
            }

            closeModal() {
                const modal = document.getElementById('modal-container');
                modal.classList.add('hidden');
            }

            // --- View Renderers ---

            renderLoginView() {
                return `
                    <div class="flex flex-col h-full justify-between py-6">
                        <div class="text-center space-y-3 mt-4">
                            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-violet-500 rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-indigo-500/20 mb-4">
                                <i data-lucide="book-open" class="w-8 h-8 text-white"></i>
                            </div>
                            <h1 class="text-2xl font-extrabold text-white">英単語トレーニング</h1>
                            <p class="text-slate-400 text-sm">名前を入力して学習をスタートしよう！</p>
                        </div>

                        <div class="bg-slate-900/60 p-6 rounded-2xl border border-slate-700/60 space-y-4 my-auto">
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">生徒名・ユーザー名</label>
                            <input id="login-name-input" type="text" placeholder="例: たろう" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-base">
                            <button onclick="app.login(document.getElementById('login-name-input').value)" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
                                <span>学習をはじめる</span>
                                <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <div class="text-center text-xs text-slate-500">
                            ※ 学習結果はお使いの端末に自動保存されます
                        </div>
                    </div>
                `;
            }

            renderHomeView() {
                const userData = this.getCurrentUserData();
                const totalAnswered = userData.totalAnswered || 0;
                const totalCorrect = userData.totalCorrect || 0;
                const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;

                // レベルごとの件数カウント
                const countA = this.words.filter(w => (w.level || 'A') === 'A').length;
                const countB = this.words.filter(w => w.level === 'B').length;
                const countC = this.words.filter(w => w.level === 'C').length;

                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <!-- Stats Summary Card -->
                        <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">学習ステータス</span>
                                <span class="text-xs px-2.5 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-full font-medium">全単語: ${this.words.length} 語</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3 pt-1">
                                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50 text-center">
                                    <div class="text-xs text-slate-400 mb-1">総解答数</div>
                                    <div class="text-xl font-bold text-slate-100">${totalAnswered} <span class="text-xs font-normal text-slate-400">問</span></div>
                                </div>
                                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50 text-center">
                                    <div class="text-xs text-slate-400 mb-1">平均正答率</div>
                                    <div class="text-xl font-bold text-emerald-400">${accuracy}%</div>
                                </div>
                            </div>
                        </div>

                        <!-- Quiz Settings: Level & Order Selection -->
                        <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-4 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-2">難易度を選択</label>
                                <div class="grid grid-cols-4 gap-2">
                                    ${[
                                        { id: 'ALL', label: 'すべて', count: this.words.length },
                                        { id: 'A', label: 'ランク A', count: countA },
                                        { id: 'B', label: 'ランク B', count: countB },
                                        { id: 'C', label: 'ランク C', count: countC }
                                    ].map(lvl => `
                                        <button onclick="app.selectedLevel='${lvl.id}'; app.render();" 
                                            class="py-2 px-1 rounded-xl border text-xs font-bold transition flex flex-col items-center justify-center ${this.selectedLevel === lvl.id ? 'bg-indigo-600 border-indigo-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                                            <span>${lvl.label}</span>
                                            <span class="text-[10px] font-normal opacity-80">${lvl.count}語</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-2">出題順序を選択</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="app.selectedOrder='sequential'; app.render();" 
                                        class="py-2.5 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-2 ${this.selectedOrder === 'sequential' ? 'bg-violet-600 border-violet-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                                        <i data-lucide="list-ordered" class="w-4 h-4"></i>
                                        <span>順番通り</span>
                                    </button>
                                    <button onclick="app.selectedOrder='random'; app.render();" 
                                        class="py-2.5 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-2 ${this.selectedOrder === 'random' ? 'bg-violet-600 border-violet-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                                        <i data-lucide="shuffle" class="w-4 h-4"></i>
                                        <span>ランダム</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Main Actions -->
                        <div class="space-y-2.5">
                            <button onclick="app.startQuiz(10)" class="w-full p-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 rounded-2xl shadow-xl shadow-indigo-600/25 flex items-center justify-between text-left transition group">
                                <div class="flex items-center space-x-4">
                                    <div class="w-11 h-11 bg-white/10 rounded-xl flex items-center justify-center text-white">
                                        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-white text-base">スピードテスト (10問)</h3>
                                        <p class="text-xs text-indigo-200">${this.selectedLevel === 'ALL' ? '全範囲' : 'ランク ' + this.selectedLevel} ・ ${this.selectedOrder === 'sequential' ? '順番通り' : 'ランダム'}</p>
                                    </div>
                                </div>
                                <i data-lucide="chevron-right" class="w-5 h-5 text-indigo-200 group-hover:translate-x-1 transition"></i>
                            </button>

                            <button onclick="app.startQuiz(20)" class="w-full p-3.5 bg-slate-900 border border-slate-700/80 hover:bg-slate-700/50 rounded-2xl flex items-center justify-between text-left transition group">
                                <div class="flex items-center space-x-4">
                                    <div class="w-10 h-10 bg-amber-500/20 rounded-xl flex items-center justify-center text-amber-400 border border-amber-500/30">
                                        <i data-lucide="flame" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-100 text-sm">ロングテスト (20问)</h3>
                                        <p class="text-[11px] text-slate-400">じっくり取り組みたいとき向け</p>
                                    </div>
                                </div>
                                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:translate-x-1 transition"></i>
                            </button>
                        </div>

                        <!-- Secondary Nav -->
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <button onclick="app.currentView='history'; app.render();" class="p-3 bg-slate-900 border border-slate-700/70 hover:bg-slate-700/50 rounded-xl text-center text-slate-300 font-semibold text-xs flex items-center justify-center space-x-2 transition">
                                <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i>
                                <span>学習記録</span>
                            </button>
                            <button onclick="app.currentView='manage'; app.render();" class="p-3 bg-slate-900 border border-slate-700/70 hover:bg-slate-700/50 rounded-xl text-center text-slate-300 font-semibold text-xs flex items-center justify-center space-x-2 transition">
                                <i data-lucide="file-plus" class="w-4 h-4 text-emerald-400"></i>
                                <span>単語追加・管理</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            renderQuizView() {
                const qs = this.quizState;
                const currentQ = qs.questions[qs.currentIndex];
                const total = qs.questions.length;
                const progressPercent = ((qs.currentIndex) / total) * 100;

                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <!-- Top Info & Timer -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-between text-xs text-slate-400 font-semibold">
                                <span>問題 ${qs.currentIndex + 1} / ${total}</span>
                                <span id="timer-text" class="text-indigo-400 font-bold text-sm">${qs.timeLeft}秒</span>
                            </div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                            </div>
                            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div id="timer-bar" class="bg-amber-400 h-full transition-all duration-1000 linear" style="width: ${(qs.timeLeft / 10) * 100}%"></div>
                            </div>
                        </div>

                        <!-- Word Card -->
                        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 text-center shadow-xl my-auto relative flex flex-col items-center justify-center min-h-[150px]">
                            <button onclick="app.playCurrentAudio()" class="absolute top-4 right-4 p-2.5 bg-slate-800 hover:bg-slate-700 rounded-full text-indigo-400 transition shadow" title="発音を聞く">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <span class="text-xs text-indigo-400 font-semibold tracking-widest uppercase mb-1">英単語</span>
                            <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">${currentQ.en}</h2>
                            <p id="time-warning" class="text-xs text-slate-500 mt-2">正しい日本語訳を選んでください</p>
                        </div>

                        <!-- Choices Grid -->
                        <div id="choices-container" class="grid grid-cols-1 gap-3">
                            ${currentQ.choices.map((choice, index) => `
                                <button onclick="app.handleAnswer(${index})" id="choice-${index}" 
                                    class="choice-btn w-full p-4 bg-slate-900 hover:bg-slate-700/80 border border-slate-700 rounded-2xl text-left font-medium text-slate-200 transition flex items-center justify-between group active:scale-[0.98]">
                                    <span class="flex items-center space-x-3">
                                        <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 font-bold text-xs flex items-center justify-center group-hover:border-indigo-500 group-hover:text-indigo-400 transition">${index + 1}</span>
                                        <span class="text-sm sm:text-base">${choice}</span>
                                    </span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Next Question Button -->
                        <div id="next-btn-container" class="hidden pt-1">
                            <button onclick="app.nextQuestion()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
                                <span>${qs.currentIndex + 1 === total ? '結果を見る' : '次の問題へ'}</span>
                                <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            renderResultView() {
                const qs = this.quizState;
                const total = qs.questions.length;
                const correct = qs.correctCount;
                const accuracy = Math.round((correct / total) * 100);

                let rank = "S+";
                let colorClass = "text-amber-400";
                if (accuracy < 60) { rank = "C"; colorClass = "text-slate-400"; }
                else if (accuracy < 80) { rank = "B"; colorClass = "text-blue-400"; }
                else if (accuracy < 100) { rank = "A"; colorClass = "text-emerald-400"; }

                return `
                    <div class="flex flex-col h-full justify-between py-2 text-center">
                        <div class="space-y-2 mt-4">
                            <span class="text-xs font-bold text-indigo-400 tracking-wider uppercase">TEST COMPLETED</span>
                            <h2 class="text-2xl font-extrabold text-white">クイズ結果</h2>
                        </div>

                        <div class="bg-slate-900 border border-slate-700/80 rounded-3xl p-6 my-auto space-y-4 shadow-xl">
                            <div class="inline-block px-4 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-300">
                                評価ランク: <span class="font-extrabold text-base ${colorClass} ml-1">${rank}</span>
                            </div>
                            <div>
                                <div class="text-5xl font-black text-white tracking-tight">${correct} <span class="text-xl text-slate-500 font-bold">/ ${total} 問</span></div>
                                <div class="text-sm font-semibold text-emerald-400 mt-2">正答率 ${accuracy}%</div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <button onclick="app.startQuiz(${total})" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                                <span>もう一度チャレンジ</span>
                            </button>
                            <button onclick="app.goHome()" class="w-full py-3.5 bg-slate-900 hover:bg-slate-700/50 border border-slate-700 text-slate-300 font-semibold rounded-2xl transition">
                                ホームに戻る
                            </button>
                        </div>
                    </div>
                `;
            }

            renderHistoryView() {
                const userData = this.getCurrentUserData();
                const history = userData.history || [];

                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                            <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="history" class="w-5 h-5 text-indigo-400"></i>
                                学習記録 (${this.currentUser})
                            </h2>
                            <button onclick="app.goHome()" class="text-xs text-slate-400 hover:text-slate-200">閉じる</button>
                        </div>

                        <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                            ${history.length === 0 ? `
                                <div class="text-center text-slate-500 py-12 text-sm">
                                    まだテスト履歴がありません。<br>クイズにチャレンジしてみましょう！
                                </div>
                            ` : history.map(item => `
                                <div class="bg-slate-900 border border-slate-700/70 rounded-xl p-3.5 flex items-center justify-between">
                                    <div>
                                        <div class="text-xs text-slate-400">${item.date}</div>
                                        <div class="text-sm font-bold text-slate-200">${item.correct} / ${item.total} 正解</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-base font-extrabold ${item.accuracy >= 80 ? 'text-emerald-400' : 'text-amber-400'}">${item.accuracy}%</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="app.goHome()" class="w-full py-3.5 bg-slate-900 border border-slate-700 hover:bg-slate-700/50 text-slate-300 font-semibold rounded-xl transition">
                            ホームへ戻る
                        </button>
                    </div>
                `;
            }

            renderManageView() {
                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                            <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="file-plus" class="w-5 h-5 text-emerald-400"></i>
                                単語リストの追加・管理
                            </h2>
                            <button onclick="app.goHome()" class="text-xs text-slate-400 hover:text-slate-200">閉じる</button>
                        </div>

                        <div class="space-y-4 my-auto">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Excel / CSV データの貼り付け</label>
                                <textarea id="csv-input" rows="5" placeholder="例:&#10;apple,りんご,A&#10;banana,バナナ,B&#10;cat,ねこ,C" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-mono"></textarea>
                                <p class="text-[11px] text-slate-500 mt-1">「英語,日本語,難易度(A/B/C)」の形式で入力してください（難易度は省略可）。</p>
                            </div>

                            <button onclick="app.importCSV()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                <span>単語をインポート</span>
                            </button>

                            <hr class="border-slate-700/50">

                            <button onclick="app.resetDefaultWords()" class="w-full py-2.5 bg-slate-900 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-700 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-1.5">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                <span>初期データにリセット</span>
                            </button>
                        </div>

                        <button onclick="app.goHome()" class="w-full py-3.5 bg-slate-900 border border-slate-700 hover:bg-slate-700/50 text-slate-300 font-semibold rounded-xl transition">
                            ホームへ戻る
                        </button>
                    </div>
                `;
            }

            render() {
                const headerUserInfo = document.getElementById('header-user-info');
                const headerUsername = document.getElementById('header-username');
                
                if (this.currentUser) {
                    headerUserInfo.classList.remove('hidden');
                    headerUserInfo.classList.add('flex');
                    headerUsername.textContent = this.currentUser;
                } else {
                    headerUserInfo.classList.remove('flex');
                    headerUserInfo.classList.add('hidden');
                }

                const main = document.getElementById('main-content');
                main.innerHTML = '';

                switch (this.currentView) {
                    case 'login':
                        main.innerHTML = this.renderLoginView();
                        break;
                    case 'home':
                        main.innerHTML = this.renderHomeView();
                        break;
                    case 'quiz':
                        main.innerHTML = this.renderQuizView();
                        this.startQuizTimer();
                        break;
                    case 'result':
                        main.innerHTML = this.renderResultView();
                        break;
                    case 'history':
                        main.innerHTML = this.renderHistoryView();
                        break;
                    case 'manage':
                        main.innerHTML = this.renderManageView();
                        break;
                }
                lucide.createIcons();
            }
        }

        // Initialize application instance
        const app = new VocabApp();
        window.onload = () => {
            app.render();
        };
    </script>
</body>
</html>
