    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Zen Maru Gothic', sans-serif;
            touch-action: manipulation;
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

            <div id="modal-icon-wrapper" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4 bg-indigo-500/20 text-indigo-400">

            </div>

        class VocabApp {
            constructor() {
                this.currentUser = localStorage.getItem('vocab_current_user') || null;
                this.words = this.loadWords();
                this.selectedLevel = 'A'; // 'A', 'B', 'C', 'ALL'
                this.selectedOrder = 'sequential'; // 'sequential' (順番) または 'random' (ランダム)
                this.currentView = this.currentUser ? 'home' : 'login';
                this.currentSetInfo = null; // { setName: 'A-1', words: [...] }
                this.quizState = {
                    questions: [],
                    currentIndex: 0,
                    score: 0,
                    correctCount: 0,
                    timer: null,
                    timeLeft: 10,
                    isAnswered: false
                };
                this.initSpeech();
            }

            initSpeech() {
                this.synth = window.speechSynthesis;
            }

            speak(text) {
                if (!this.synth) return;
                this.synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                this.synth.speak(utterance);
            }

            loadWords() {
                const saved = localStorage.getItem('vocab_custom_words');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        return DEFAULT_WORDS;
                    }
                }
                return DEFAULT_WORDS;
            }

            saveCustomWords(words) {
                this.words = words;
                localStorage.setItem('vocab_custom_words', JSON.stringify(words));
            }

            getUsersData() {
                const saved = localStorage.getItem('vocab_users_data');
                return saved ? JSON.parse(saved) : {};
            }

            saveUserData(username, stats) {
                const data = this.getUsersData();
                if (!data[username]) {
                    data[username] = { history: [], totalAnswered: 0, totalCorrect: 0, setScores: {} };
                }
                if (!data[username].setScores) data[username].setScores = {};

                data[username].history.unshift(stats); // 最新順
                data[username].totalAnswered += stats.total;
                data[username].totalCorrect += stats.correct;

                // セット最高得点の記録
                if (stats.setName) {
                    const prevMax = data[username].setScores[stats.setName] || 0;
                    if (stats.correct > prevMax) {
                        data[username].setScores[stats.setName] = stats.correct;
                    }
                }

                localStorage.setItem('vocab_users_data', JSON.stringify(data));
            }

            getCurrentUserData() {
                if (!this.currentUser) return { history: [], totalAnswered: 0, totalCorrect: 0, setScores: {} };
                const data = this.getUsersData();
                const userData = data[this.currentUser] || { history: [], totalAnswered: 0, totalCorrect: 0, setScores: {} };
                if (!userData.setScores) userData.setScores = {};
                return userData;
            }

            clearCurrentUserData() {
                if (!this.currentUser) return;
                const data = this.getUsersData();
                if (data[this.currentUser]) {
                    delete data[this.currentUser];
                    localStorage.setItem('vocab_users_data', JSON.stringify(data));
                    this.showModal('消去完了', `${this.currentUser} さんの学習記録を削除しました。`, 'check-circle');
                    this.render();
                }
            }

            login(name) {
                const trimmed = name.trim();
                if (!trimmed) {
                    this.showModal('エラー', 'お名前を入力してください。', 'alert-circle');
                    return;
                }
                this.currentUser = trimmed;
                localStorage.setItem('vocab_current_user', trimmed);
                this.currentView = 'home';
                this.render();
            }

            logout() {
                this.currentUser = null;
                localStorage.removeItem('vocab_current_user');
                this.currentView = 'login';
                this.render();
            }

            goHome() {
                if (this.currentUser) {
                    this.stopQuizTimer();
                    this.currentView = 'home';
                    this.render();
                }
            }

            // 指定セットまたはランダム10問でクイズを開始
            startQuizSet(setName, targetWords) {
                if (targetWords.length < 4) {
                    this.showModal('注意', '出題に必要な単語数（選択肢用含め4語以上）が不足しています。', 'alert-triangle');
                    return;
                }

                this.currentSetInfo = { setName, totalWords: targetWords.length };

                let quizWords = [...targetWords];
                if (this.selectedOrder === 'random') {
                    quizWords.sort(() => Math.random() - 0.5);
                }

                this.quizState.questions = quizWords.map(item => {
                    // 誤答の選択肢を全体から3つ抽出
                    const distractors = this.words
                        .filter(w => w.id !== item.id)
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 3)
                        .map(w => w.ja);
                    
                    const choices = [...distractors, item.ja].sort(() => Math.random() - 0.5);

                    return {
                        en: item.en,
                        ja: item.ja,
                        choices: choices
                    };
                });

                this.quizState.currentIndex = 0;
                this.quizState.correctCount = 0;
                this.quizState.isAnswered = false;
                this.currentView = 'quiz';
                this.render();
                this.playCurrentAudio();
            }

            startQuizTimer() {
                this.stopQuizTimer();
                this.quizState.timeLeft = 10;
                this.updateTimerDisplay();

                this.quizState.timer = setInterval(() => {
                    this.quizState.timeLeft--;
                    this.updateTimerDisplay();

                    if (this.quizState.timeLeft <= 0) {
                        this.stopQuizTimer();
                        this.handleTimeout();
                    }
                }, 1000);
            }

            stopQuizTimer() {
                if (this.quizState.timer) {
                    clearInterval(this.quizState.timer);
                    this.quizState.timer = null;
                }
            }

            updateTimerDisplay() {
                const timerText = document.getElementById('timer-text');
                const timerBar = document.getElementById('timer-bar');
                if (timerText) timerText.textContent = `${this.quizState.timeLeft}秒`;
                if (timerBar) timerBar.style.width = `${(this.quizState.timeLeft / 10) * 100}%`;
            }

            playCurrentAudio() {
                const currentQ = this.quizState.questions[this.quizState.currentIndex];
                if (currentQ) {
                    this.speak(currentQ.en);
                }
            }

            handleTimeout() {
                const qs = this.quizState;
                if (qs.isAnswered) return;
                qs.isAnswered = true;

                const currentQ = qs.questions[qs.currentIndex];
                
                currentQ.choices.forEach((choice, idx) => {
                    const btn = document.getElementById(`choice-${idx}`);
                    if (btn) {
                        if (choice === currentQ.ja) {
                            btn.classList.remove('bg-slate-900', 'border-slate-700');
                            btn.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-300');
                        } else {
                            btn.classList.add('opacity-50');
                        }
                        btn.disabled = true;
                    }
                });

                const warning = document.getElementById('time-warning');
                if (warning) {
                    warning.textContent = "時間切れ！正解を確認して「次の問題へ」を押してください。";
                    warning.classList.remove('text-slate-500');
                    warning.classList.add('text-amber-400', 'font-bold');
                }

                this.playCurrentAudio();
                this.showNextButton();
            }

            handleAnswer(selectedIndex) {
                const qs = this.quizState;
                if (qs.isAnswered) return;
                qs.isAnswered = true;
                this.stopQuizTimer();

                const currentQ = qs.questions[qs.currentIndex];
                const selectedChoice = currentQ.choices[selectedIndex];
                const isCorrect = (selectedChoice === currentQ.ja);

                if (isCorrect) {
                    qs.correctCount++;
                }

                currentQ.choices.forEach((choice, idx) => {
                    const btn = document.getElementById(`choice-${idx}`);
                    if (btn) {
                        if (choice === currentQ.ja) {
                            btn.classList.remove('bg-slate-900', 'border-slate-700');
                            btn.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-300');
                        } else if (idx === selectedIndex && !isCorrect) {
                            btn.classList.remove('bg-slate-900', 'border-slate-700');
                            btn.classList.add('bg-red-600/30', 'border-red-500', 'text-red-300', 'shake');
                        } else {
                            btn.classList.add('opacity-50');
                        }
                        btn.disabled = true;
                    }
                });

                this.playCurrentAudio();
                this.showNextButton();
            }

            showNextButton() {
                const nextBtnContainer = document.getElementById('next-btn-container');
                if (nextBtnContainer) {
                    nextBtnContainer.classList.remove('hidden');
                    nextBtnContainer.classList.add('pop-in');
                }
            }

            nextQuestion() {
                const qs = this.quizState;
                qs.currentIndex++;
                qs.isAnswered = false;

                if (qs.currentIndex < qs.questions.length) {
                    this.currentView = 'quiz';
                    this.render();
                    this.startQuizTimer();
                    this.playCurrentAudio();
                } else {
                    this.saveCurrentQuizResult();
                    this.currentView = 'result';
                    this.render();
                }
            }

            saveCurrentQuizResult() {
                const qs = this.quizState;
                const total = qs.questions.length;
                const correct = qs.correctCount;
                const accuracy = Math.round((correct / total) * 100);
                
                const stats = {
                    setName: this.currentSetInfo ? this.currentSetInfo.setName : 'ランダム',
                    date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    total: total,
                    correct: correct,
                    accuracy: accuracy
                };

                this.saveUserData(this.currentUser, stats);
            }

            importCSV() {
                const text = document.getElementById('csv-input').value.trim();
                if (!text) {
                    this.showModal('エラー', 'CSVデータが入力されていません。', 'alert-triangle');
                    return;
                }

                const lines = text.split('\n');
                const newWords = [...this.words];
                let maxId = newWords.reduce((max, w) => Math.max(max, w.id), 0);
                let addedCount = 0;

                for (let line of lines) {
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const en = parts[0].trim();
                        const ja = parts[1].trim();
                        const level = parts[2] ? parts[2].trim().toUpperCase() : 'A';
                        if (en && ja) {
                            maxId++;
                            newWords.push({ id: maxId, en, ja, level: ['A', 'B', 'C'].includes(level) ? level : 'A' });
                            addedCount++;
                        }
                    }
                }

                if (addedCount > 0) {
                    this.saveCustomWords(newWords);
                    this.showModal('成功', `${addedCount} 語の単語を追加しました！`, 'check-circle');
                    document.getElementById('csv-input').value = '';
                    this.render();
                } else {
                    this.showModal('エラー', '有効なフォーマット（英語,日本語,難易度）で見つかりませんでした。', 'alert-triangle');
                }
            }

            resetDefaultWords() {
                this.saveCustomWords(DEFAULT_WORDS);
                this.showModal('初期化完了', '単語リストを初期の基本データにリセットしました。', 'check-circle');
                this.render();
            }

            showModal(title, message, iconName = 'info') {
                const modal = document.getElementById('modal-container');
                const modalTitle = document.getElementById('modal-title');
                const modalMessage = document.getElementById('modal-message');
                const modalIcon = document.getElementById('modal-icon');

                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalIcon.setAttribute('data-lucide', iconName);
                modal.classList.remove('hidden');
                lucide.createIcons();
            }

            closeModal() {
                const modal = document.getElementById('modal-container');
                modal.classList.add('hidden');
            }

            renderHomeView() {
                const userData = this.getCurrentUserData();
                const totalAnswered = userData.totalAnswered || 0;
                const totalCorrect = userData.totalCorrect || 0;
                const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
                const setScores = userData.setScores || {};

                // 難易度ごとに単語をフィルタリング
                let filteredWords = this.words.filter(w => (w.level || 'A') === this.selectedLevel);
                if (this.selectedLevel === 'ALL') filteredWords = this.words;

                // 10問ずつの「セット」に分割作成
                const sets = [];
                const chunkSize = 10;
                for (let i = 0; i < filteredWords.length; i += chunkSize) {
                    const chunk = filteredWords.slice(i, i + chunkSize);
                    const setNum = Math.floor(i / chunkSize) + 1;
                    const setName = `${this.selectedLevel}-${setNum}`;
                    sets.push({
                        name: setName,
                        startNum: i + 1,
                        endNum: i + chunk.length,
                        words: chunk
                    });
                }

                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <!-- Stats Summary Card -->
                        <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">学習ステータス</span>
                                <span class="text-xs px-2.5 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-full font-medium">全単語: ${this.words.length} 語</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3 pt-1">
                                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50 text-center">
                                    <div class="text-xs text-slate-400 mb-1">総解答数</div>
                                    <div class="text-xl font-bold text-slate-100">${totalAnswered} <span class="text-xs font-normal text-slate-400">問</span></div>
                                </div>
                                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50 text-center">
                                    <div class="text-xs text-slate-400 mb-1">平均正答率</div>
                                    <div class="text-xl font-bold text-emerald-400">${accuracy}%</div>
                                </div>
                            </div>
                        </div>

                        <!-- Quiz Settings: Level & Order Selection -->
                        <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-4 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-2">難易度を選択</label>
                                <div class="grid grid-cols-3 gap-2">
                                    ${[
                                        { id: 'A', label: 'ランク A' },
                                        { id: 'B', label: 'ランク B' },
                                        { id: 'C', label: 'ランク C' }
                                    ].map(lvl => `
                                        <button onclick="app.selectedLevel='${lvl.id}'; app.render();" 
                                            class="py-2.5 px-2 rounded-xl border text-xs font-bold transition ${this.selectedLevel === lvl.id ? 'bg-indigo-600 border-indigo-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                                            <span>${lvl.label}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-2">出題順序</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="app.selectedOrder='sequential'; app.render();" 
                                        class="py-2 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-1.5 ${this.selectedOrder === 'sequential' ? 'bg-violet-600 border-violet-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                                        <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i>
                                        <span>順番通り</span>
                                    </button>
                                    <button onclick="app.selectedOrder='random'; app.render();" 
                                        class="py-2 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-1.5 ${this.selectedOrder === 'random' ? 'bg-violet-600 border-violet-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                                        <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
                                        <span>ランダム</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 10-Word Set List -->
                        <div class="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                            <div class="text-xs font-bold text-slate-400 mb-1 flex items-center justify-between">
                                <span>学習セット (各10問)</span>
                                <span>全 ${sets.length} セット</span>
                            </div>
                            ${sets.length === 0 ? `
                                <div class="text-center text-xs text-slate-500 py-4">この難易度の単語がまだ登録されていません</div>
                            ` : sets.map(set => {
                                const bestScore = setScores[set.name];
                                const isCleared = bestScore !== undefined;
                                return `
                                    <button onclick="app.startQuizSet('${set.name}', app.words.filter(w => w.id >= ${set.words[0].id} && w.id <= ${set.words[set.words.length - 1].id}))" 
                                        class="w-full p-3.5 bg-slate-900 border ${isCleared ? 'border-indigo-500/50' : 'border-slate-700/80'} hover:bg-slate-700/50 rounded-2xl flex items-center justify-between transition group text-left">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-9 h-9 rounded-xl ${isCleared ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'} flex items-center justify-center font-bold text-xs">
                                                ${set.name}
                                            </div>
                                            <div>
                                                <h4 class="font-bold text-slate-200 text-sm">セット ${set.name}</h4>
                                                <p class="text-[11px] text-slate-400">${set.startNum} 〜 ${set.endNum} 語目</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            ${isCleared ? `
                                                <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg border border-emerald-500/20">${bestScore}/${set.words.length} 正解</span>
                                            ` : `
                                                <span class="text-xs text-slate-500">未テスト</span>
                                            `}
                                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:translate-x-1 transition"></i>
                                        </div>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- Secondary Nav -->
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <button onclick="app.currentView='history'; app.render();" class="p-3 bg-slate-900 border border-slate-700/70 hover:bg-slate-700/50 rounded-xl text-center text-slate-300 font-semibold text-xs flex items-center justify-center space-x-2 transition">
                                <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i>
                                <span>学習記録</span>
                            </button>
                            <button onclick="app.currentView='manage'; app.render();" class="p-3 bg-slate-900 border border-slate-700/70 hover:bg-slate-700/50 rounded-xl text-center text-slate-300 font-semibold text-xs flex items-center justify-center space-x-2 transition">
                                <i data-lucide="file-plus" class="w-4 h-4 text-emerald-400"></i>
                                <span>単語追加・管理</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            renderQuizView() {
                const qs = this.quizState;
                const currentQ = qs.questions[qs.currentIndex];
                const total = qs.questions.length;
                const progressPercent = ((qs.currentIndex) / total) * 100;
                const setName = this.currentSetInfo ? this.currentSetInfo.setName : 'クイズ';

                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <!-- Top Info & Timer -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-between text-xs text-slate-400 font-semibold">
                                <span class="bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-md font-bold">セット ${setName}</span>
                                <span>問題 ${qs.currentIndex + 1} / ${total}</span>
                                <span id="timer-text" class="text-indigo-400 font-bold text-sm">${qs.timeLeft}秒</span>
                            </div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                            </div>
                            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div id="timer-bar" class="bg-amber-400 h-full transition-all duration-1000 linear" style="width: ${(qs.timeLeft / 10) * 100}%"></div>
                            </div>
                        </div>

                        <!-- Word Card -->
                        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 text-center shadow-xl my-auto relative flex flex-col items-center justify-center min-h-[150px]">
                            <button onclick="app.playCurrentAudio()" class="absolute top-4 right-4 p-2.5 bg-slate-800 hover:bg-slate-700 rounded-full text-indigo-400 transition shadow" title="発音を聞く">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <span class="text-xs text-indigo-400 font-semibold tracking-widest uppercase mb-1">英単語</span>
                            <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">${currentQ.en}</h2>
                            <p id="time-warning" class="text-xs text-slate-500 mt-2">正しい日本語訳を選んでください</p>
                        </div>

                        <!-- Choices Grid -->
                        <div id="choices-container" class="grid grid-cols-1 gap-3">
                            ${currentQ.choices.map((choice, index) => `
                                <button onclick="app.handleAnswer(${index})" id="choice-${index}" 
                                    class="choice-btn w-full p-4 bg-slate-900 hover:bg-slate-700/80 border border-slate-700 rounded-2xl text-left font-medium text-slate-200 transition flex items-center justify-between group active:scale-[0.98]">
                                    <span class="flex items-center space-x-3">
                                        <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 font-bold text-xs flex items-center justify-center group-hover:border-indigo-500 group-hover:text-indigo-400 transition">${index + 1}</span>
                                        <span class="text-sm sm:text-base">${choice}</span>
                                    </span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Next Question Button -->
                        <div id="next-btn-container" class="hidden pt-1">
                            <button onclick="app.nextQuestion()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
                                <span>${qs.currentIndex + 1 === total ? '結果を見る' : '次の問題へ'}</span>
                                <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            renderResultView() {
                const qs = this.quizState;
                const total = qs.questions.length;
                const correct = qs.correctCount;
                const accuracy = Math.round((correct / total) * 100);
                const setName = this.currentSetInfo ? this.currentSetInfo.setName : 'クイズ';

                let rank = "S+";
                let colorClass = "text-amber-400";
                if (accuracy < 60) { rank = "C"; colorClass = "text-slate-400"; }
                else if (accuracy < 80) { rank = "B"; colorClass = "text-blue-400"; }
                else if (accuracy < 100) { rank = "A"; colorClass = "text-emerald-400"; }

                return `
                    <div class="flex flex-col h-full justify-between py-2 text-center">
                        <div class="space-y-2 mt-4">
                            <span class="text-xs font-bold text-indigo-400 tracking-wider uppercase">SET ${setName} COMPLETED</span>
                            <h2 class="text-2xl font-extrabold text-white">クイズ結果</h2>
                        </div>

                        <div class="bg-slate-900 border border-slate-700/80 rounded-3xl p-6 my-auto space-y-4 shadow-xl">
                            <div class="inline-block px-4 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-300">
                                評価ランク: <span class="font-extrabold text-base ${colorClass} ml-1">${rank}</span>
                            </div>
                            <div>
                                <div class="text-5xl font-black text-white tracking-tight">${correct} <span class="text-xl text-slate-500 font-bold">/ ${total} 問</span></div>
                                <div class="text-sm font-semibold text-emerald-400 mt-2">正答率 ${accuracy}%</div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <button onclick="app.startQuizSet('${setName}', app.quizState.questions.map((q, idx) => ({ id: idx, en: q.en, ja: q.ja })))" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                                <span>このセットをもう一度</span>
                            </button>
                            <button onclick="app.goHome()" class="w-full py-3.5 bg-slate-900 hover:bg-slate-700/50 border border-slate-700 text-slate-300 font-semibold rounded-2xl transition">
                                ホームに戻る
                            </button>
                        </div>
                    </div>
                `;
            }

            renderHistoryView() {
                const userData = this.getCurrentUserData();
                const history = userData.history || [];

                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                            <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="history" class="w-5 h-5 text-indigo-400"></i>
                                学習記録 (${this.currentUser})
                            </h2>
                            <button onclick="app.goHome()" class="text-xs text-slate-400 hover:text-slate-200">閉じる</button>
                        </div>

                        <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                            ${history.length === 0 ? `
                                <div class="text-center text-slate-500 py-12 text-sm">
                                    まだテスト履歴がありません。<br>クイズにチャレンジしてみましょう！
                                </div>
                            ` : history.map(item => `
                                <div class="bg-slate-900 border border-slate-700/70 rounded-xl p-3.5 flex items-center justify-between">
                                    <div>
                                        <div class="text-xs text-indigo-400 font-bold">${item.setName ? 'セット ' + item.setName : 'ランダム'} ・ ${item.date}</div>
                                        <div class="text-sm font-bold text-slate-200">${item.correct} / ${item.total} 正解</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-base font-extrabold ${item.accuracy >= 80 ? 'text-emerald-400' : 'text-amber-400'}">${item.accuracy}%</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="space-y-2">
                            <button onclick="app.clearCurrentUserData()" class="w-full py-2 bg-slate-900 hover:bg-red-500/20 text-red-400 border border-slate-700 rounded-xl text-xs font-semibold transition">
                                このユーザーの学習記録をリセット
                            </button>
                            <button onclick="app.goHome()" class="w-full py-3.5 bg-slate-900 border border-slate-700 hover:bg-slate-700/50 text-slate-300 font-semibold rounded-xl transition">
                                ホームへ戻る
                            </button>
                        </div>
                    </div>
                `;
            }

            renderManageView() {
                return `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                            <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="file-plus" class="w-5 h-5 text-emerald-400"></i>
                                単語リストの追加・管理
                            </h2>
                            <button onclick="app.goHome()" class="text-xs text-slate-400 hover:text-slate-200">閉じる</button>
                        </div>

                        <div class="space-y-4 my-auto">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Excel / CSV データの貼り付け</label>
                                <textarea id="csv-input" rows="5" placeholder="例:&#10;apple,りんご,A&#10;banana,バナナ,B&#10;cat,ねこ,C" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-mono"></textarea>
                                <p class="text-[11px] text-slate-500 mt-1">「英語,日本語,難易度(A/B/C)」の形式で入力してください（難易度は省略可）。</p>
                            </div>

                            <button onclick="app.importCSV()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                <span>単語をインポート</span>
                            </button>

                            <hr class="border-slate-700/50">

                            <button onclick="app.resetDefaultWords()" class="w-full py-2.5 bg-slate-900 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-700 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-1.5">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                <span>初期データにリセット</span>
                            </button>
                        </div>

                        <button onclick="app.goHome()" class="w-full py-3.5 bg-slate-900 border border-slate-700 hover:bg-slate-700/50 text-slate-300 font-semibold rounded-xl transition">
                            ホームへ戻る
                        </button>
                    </div>
                `;
            }

            render() {
                const headerUserInfo = document.getElementById('header-user-info');
                const headerUsername = document.getElementById('header-username');
                
                if (this.currentUser) {
                    headerUserInfo.classList.remove('hidden');
                    headerUserInfo.classList.add('flex');
                    headerUsername.textContent = this.currentUser;
                } else {
                    headerUserInfo.classList.remove('flex');
                    headerUserInfo.classList.add('hidden');
                }

                const main = document.getElementById('main-content');
                main.innerHTML = '';

                switch (this.currentView) {
                    case 'login':
                        main.innerHTML = this.renderLoginView();
                        break;
                    case 'home':
                        main.innerHTML = this.renderHomeView();
                        break;
                    case 'quiz':
                        main.innerHTML = this.renderQuizView();
                        this.startQuizTimer();
                        break;
                    case 'result':
                        main.innerHTML = this.renderResultView();
                        break;
                    case 'history':
                        main.innerHTML = this.renderHistoryView();
                        break;
                    case 'manage':
                        main.innerHTML = this.renderManageView();
                        break;
                }
                lucide.createIcons();
            }
        }

        // Initialize application instance
        const app = new VocabApp();
        window.onload = () => {
            app.render();
        };
    </script>
</body>
</html>
